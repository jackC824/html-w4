<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Store 積木商城</title>

<style>

:root{
    --primary:#d01012;
    --secondary:#ffd500;
    --bg:#ffffff;
    --card:#ffffff;
    --text:#222;
}

.dark{
    --bg:#121212;
    --card:#1e1e1e;
    --text:#ffffff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Microsoft JhengHei",sans-serif;
    background:var(--bg);
    color:var(--text);
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    width:100%;
    display:block;
}

.navbar{
    background:var(--card);
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
    position:sticky;
    top:0;
    z-index:999;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:var(--primary);
}

.menu{
    display:flex;
    gap:20px;
}

.search-box{
    display:flex;
    gap:10px;
}

.search-box input{
    padding:8px;
}

.slider{
    position:relative;
    height:500px;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    transition:1s;
}

.slide.active{
    opacity:1;
}

.slide img{
    height:100%;
    object-fit:cover;
}

.slide-content{
    position:absolute;
    top:50%;
    left:10%;
    transform:translateY(-50%);
    color:white;
}

.slide-content h1{
    font-size:3rem;
}

.btn{
    display:inline-block;
    margin-top:15px;
    background:var(--secondary);
    color:black;
    padding:12px 20px;
    border-radius:20px;
}

.container{
    padding:40px 8%;
}

.controls{
    display:flex;
    gap:15px;
    margin-bottom:25px;
}

.products{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.product{
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.product-info{
    padding:15px;
}

.price{
    color:var(--primary);
    font-size:22px;
    font-weight:bold;
}

.add-cart{
    width:100%;
    margin-top:10px;
    border:none;
    background:var(--primary);
    color:white;
    padding:10px;
    cursor:pointer;
    border-radius:8px;
}

.cart-box{
    background:var(--card);
    margin-top:40px;
    padding:20px;
    border-radius:12px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #ddd;
}

.cart-actions button{
    width:28px;
    height:28px;
    border:none;
    background:var(--primary);
    color:white;
    cursor:pointer;
    border-radius:4px;
}

footer{
    margin-top:50px;
    background:#111;
    color:white;
    text-align:center;
    padding:25px;
}

#topBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    background:var(--primary);
    color:white;
    display:none;
    cursor:pointer;
}

@media(max-width:768px){

    .menu{
        display:none;
    }

    .slide-content h1{
        font-size:2rem;
    }
}

</style>
</head>
<body>

<nav class="navbar">

    <div class="logo">BRICK</div>

    <div class="menu">
        #products商品</a>
        #cart購物車</a>
    </div>

    <div class="search-box">
        <input id="searchInput" type="text" placeholder="搜尋商品">
        <button id="themeToggle">🌙</button>
    </div>

</nav>

<section class="slider">

    <div class="slide active">
        <img src="169994000613_1200.jpg" alt="Banner1">
        <div class="slide-content">
            <h1>探索創意世界</h1>
            #products立即探索</a>
        </div>
    </div>

    <div class="slide">
        <img src="4200nk5.jpg" alt="Banner2">
        <div class="slide-content">
            <h1>探索創意世界</h1>
            #products立即探索</a>
        </div>
    </div>

    <div class="slide">
        <img src="5f11a163.avif" alt="Banner3">
        <div class="slide-content">
            <h1>探索創意世界</h1>
            #products立即探索</a>
        </div>
    </div>

</section>

<div class="container">

    <div class="controls">

        <select id="filter">
            <option value="all">全部商品</option>
            <option value="space">太空系列</option>
            <option value="city">城市系列</option>
            <option value="creative">創意系列</option>
        </select>

    </div>

    <section id="products">

        <div class="products">

            <div class="product"
                 data-name="未來太空站"
                 data-category="space">

                <img src="1785.avif" alt="未來太空站">

                <div class="product-info">

                    <h3>未來太空站</h3>

                    <div class="price">$1999</div>

                    <button class="add-cart"
                            data-name="未來太空站"
                            data-price="1999">
                        加入購物車
                    </button>

                </div>

            </div>

            <div class="product"
                 data-name="城市警察局"
                 data-category="city">

                <img src="images.jpg" alt="城市警察局">

                <div class="product-info">

                    <h3>城市警察局</h3>

                    <div class="price">$2299</div>

                    <button class="add-cart"
                            data-name="城市警察局"
                            data-price="2299">
                        加入購物車
                    </button>

                </div>

            </div>

            <div class="product"
                 data-name="創意工坊"
                 data-category="creative">

                <img src="169994000613_1200.jpg" alt="創意工坊">

                <div class="product-info">

                    <h3>創意工坊</h3>

                    <div class="price">$1499</div>

                    <button class="add-cart"
                            data-name="創意工坊"
                            data-price="1499">
                        加入購物車
                    </button>

                </div>

            </div>

        </div>

    </section>

    <section id="cart" class="cart-box">

        <h2>
            購物車
            (<span id="cartCount">0</span>)
        </h2>

        <div id="cartItems"></div>
<h3 id="totalPrice">
    總金額：$0
</h3>

<button
    id="clearCart"
    class="add-cart">

    清空購物車

</button>
    </section>

</div>

<footer>
    © 2026 Brick Store
</footer>

<button id="topBtn">↑</button>

<script>

/* 輪播 */

let current=0;

const slides=document.querySelectorAll(".slide");

setInterval(()=>{

    slides[current].classList.remove("active");

    current=(current+1)%slides.length;

    slides[current].classList.add("active");

},4000);


/* 深色模式 */

const themeToggle=
document.getElementById("themeToggle");

themeToggle.onclick=()=>{

    document.body.classList.toggle("dark");

};


/* 搜尋 + 分類 */

const searchInput=
document.getElementById("searchInput");

const filter=
document.getElementById("filter");

function filterProducts(){

    const keyword=
    searchInput.value.toLowerCase();

    const category=
    filter.value;

    document.querySelectorAll(".product")
    .forEach(product=>{

        const name=
        product.dataset.name.toLowerCase();

        const productCategory=
        product.dataset.category;

        const show=

            name.includes(keyword)

            &&

            (
                category==="all"
                ||
                productCategory===category
            );

        product.style.display=
        show ? "" : "none";
    });
}

searchInput.addEventListener(
"keyup",
filterProducts
);

filter.addEventListener(
"change",
filterProducts
);


/* 購物車 */

let cart=
JSON.parse(
localStorage.getItem("cart")
) || [];

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    renderCart();
}
/* 清空購物車 */

const clearCartBtn =
document.getElementById("clearCart");

clearCartBtn.addEventListener(
"click",
()=>{

    const confirmClear =
    confirm(
        "確定要清空購物車嗎？"
    );

    if(!confirmClear) return;

    cart = [];

    saveCart();

});
function renderCart(){

    const cartItems =
    document.getElementById("cartItems");

    const totalPriceEl =
    document.getElementById("totalPrice");

    const cartCountEl =
    document.getElementById("cartCount");

    let total = 0;
    let count = 0;

    cartItems.innerHTML = "";

    cart.forEach((item,index)=>{

        total += item.price * item.qty;
        count += item.qty;

        cartItems.innerHTML += `
        <div class="cart-item">

            <span>
                ${item.name} x ${item.qty}
            </span>

            <div class="cart-actions">

                <button onclick="minusItem(${index})">
                    -
                </button>

                <button onclick="plusItem(${index})">
                    +
                </button>

            </div>

        </div>
        `;

    });

    cartCountEl.textContent = count;

    totalPriceEl.textContent =
    "總金額：$" + total;

}

window.plusItem=function(i){

    cart[i].qty++;

    saveCart();
}

window.minusItem=function(i){

    cart[i].qty--;

    if(cart[i].qty<=0){

        cart.splice(i,1);
    }

    saveCart();
}

document
.querySelectorAll(".add-cart")
.forEach(btn=>{

    btn.addEventListener("click",()=>{

        const name=
        btn.dataset.name;

        const price=
        Number(btn.dataset.price);

        const item=
        cart.find(
            p=>p.name===name
        );

        if(item){

            item.qty++;

        }else{

            cart.push({
                name,
                price,
                qty:1
            });
        }

        saveCart();

    });

});

renderCart();


/* 回到頂部 */

const topBtn=
document.getElementById("topBtn");

window.addEventListener("scroll",()=>{

    topBtn.style.display=
    window.scrollY>300
    ? "block"
    : "none";
});

topBtn.onclick=()=>{

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

</script>

</body>
</html>
